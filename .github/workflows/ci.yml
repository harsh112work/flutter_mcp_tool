name: CI
on:
  pull_request:
    branches:
       - deploy

jobs:
  build_test:
    name: "Test Flutter project"
    runs-on: "ubuntu-latest"
    steps: 
      - uses: actions/checkout@v2
      - uses: actions/setup-java@v1
        with:
          java-version: "17.x"
      - uses: subosito/flutter-action@v1
        with:
          channel: "stable"
      - run: flutter pub get
      - run: flutter analize
      - run: flutter test